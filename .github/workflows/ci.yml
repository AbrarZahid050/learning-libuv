name: Windows CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  build-ci-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CppUV
        run: cmake -S . -B build-ci -DCPPUV_BUILD_EXAMPLES=ON -DBUILD_TESTING=ON

      - name: Build CppUV and regression tests
        run: cmake --build build-ci --config Release --parallel

      - name: Run regression tests
        run: ctest --test-dir build-ci -C Release --output-on-failure
